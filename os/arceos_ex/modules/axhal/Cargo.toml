[package]
name = "ax-hal-ex"
version = "0.1.0"
repository = "https://github.com/rcore-os/tgoskits"
edition.workspace = true
authors.workspace = true
description = "arceos_ex hardware abstraction layer"
license.workspace = true

[features]
default = []
smp = ["ax-plat-riscv64-generic?/smp"]
irq = ["ax-plat-riscv64-generic?/irq"]
fp-simd = ["ax-cpu/fp-simd", "ax-plat-riscv64-generic?/fp-simd"]
rtc = ["ax-plat-riscv64-generic?/rtc"]
checkpoint-sbi-char = []
paging = []
tls = ["ax-cpu/tls"]
uspace = ["paging", "ax-cpu/uspace"]
hv = ["paging"]
myplat = []
plat-dyn = []
defplat = ["dep:ax-plat-riscv64-generic"]
ipi = ["irq"]
starry-kcov = []
axvisor-linker = []

[dependencies]
ax-config.workspace = true
ax-cpu.workspace = true
ax-memory-addr.workspace = true
ax-plat.workspace = true
log.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
ax-plat-riscv64-generic = { workspace = true, optional = true }

[build-dependencies]
ax-config.workspace = true
toml.workspace = true
